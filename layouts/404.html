{{ define "main" }}
{{- /* /en/<path> or /ko/<path> (language-prefixed URLs) -> /<path>?lang=en|ko */ -}}
<script>
(function(){var b={{ "/" | relURL }},m=location.pathname.slice(b.length-1).match(/^\/(en|ko)(\/.*)?$/);if(m)location.replace(b+(m[2]||'/').slice(1)+'?lang='+m[1]+location.hash);})();
</script>
<article class="post-single">
  <header class="post-single__header">
    <div class="label-head__kicker">// 404</div>
    <h1 class="post-single__title">페이지를 찾을 수 없습니다</h1>
  </header>
  <div class="post-body">
    <p>주소가 바뀌었거나 삭제된 글일 수 있습니다. <a href="{{ "/" | relURL }}">홈으로</a> 돌아가거나 <a href="{{ "search/" | relURL }}">검색</a>해 보세요.</p>
  </div>
</article>
{{ end }}
