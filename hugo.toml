baseURL = 'https://Knight-pray.github.io/'
languageCode = 'ko'
defaultContentLanguage = 'ko'
title = 'Jaeyeon Lee - 이재연'

# Korean-aware .Summary and word counts
hasCJKLanguage = true
enableRobotsTXT = true
# keep category / tag names as written (Hugo would otherwise title-case them)
capitalizeListTitles = false

[markup]
  [markup.goldmark.renderer]
    # raw HTML in posts, e.g. <div class="ko"> / <span class="en">
    unsafe = true
  [markup.goldmark.parser.attribute]
    # {.ko} / {.en} on the line after a paragraph, list, table or blockquote
    block = true
  [markup.goldmark.extensions.passthrough]
    # leave math untouched so KaTeX can render it in the browser
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['\[', '\]'], ['$$', '$$']]
      inline = [['\(', '\)'], ['$', '$']]
  [markup.highlight]
    # plain <pre><code class="language-x">; highlight.js colors it with the theme tokens
    codeFences = false

[taxonomies]
  category = 'categories'
  tag = 'tags'

[outputs]
  # JSON = client-side search index (/index.json)
  home = ['HTML', 'RSS', 'JSON']

[params]
  description = '아연 이온 배터리 및 고체 전해질 연구'
  author = '이재연'
  pageSize = 10
  # Search-console verification codes (leave empty to omit the tag)
  naverVerification = ''
  googleVerification = ''

  # Comments via giscus (GitHub Discussions). Enable Discussions on the repo, install
  # https://github.com/apps/giscus, then copy the four values from https://giscus.app
  # Comments stay hidden until repoId and categoryId are set.
  [params.giscus]
    repo = ''
    repoId = ''
    category = ''
    categoryId = ''

# Header nav = Home + the category groups in data/taxonomy.yaml + these entries
[menus]
  [[menus.main]]
    name = 'About'
    pageRef = 'about'
    weight = 10
